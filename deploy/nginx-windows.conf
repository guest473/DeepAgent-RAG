# 本机 Nginx 配置：前端静态托管 + /api 反向代理
#
# 不配 HTTPS，TLS 交给外层的 Cloudflare / 隧道终结；
# 路径按 Windows 写法与项目实际位置填写。
#
# 用法：
#   1. 下载 Nginx for Windows（http://nginx.org/en/download.html 的 zip 包），解压到如 C:\nginx
#   2. 把本文件内容覆盖到 C:\nginx\conf\nginx.conf（注意 root 改成你的实际路径）
#   3. 在 C:\nginx 下执行：start nginx      # 启动
#                        nginx -s reload   # 改配置后重载
#                        nginx -s stop     # 停止
#   4. 打开 http://localhost 应能看到前端页面
#
# 后端启动方式：python api_server.py（默认监听 0.0.0.0:8000）
# 后端 FORWARDED_ALLOW_IPS 保持默认 127.0.0.1 即可（Nginx 与后端同机）。

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # 与后端 MAX_UPLOAD_MB 对齐，否则大文件会在这一层被拒绝
    client_max_body_size 50m;

    # 真实客户端 IP：走 Cloudflare / 隧道时真实 IP 在 CF-Connecting-IP 头里，不解析则所有用户
    # 会被后端算成同一个 IP，互相挤占限流配额。但该头可被客户端伪造，因此只信任可信来源：
    #   方案 A（cloudflared 隧道）：80 端口仅本机 cloudflared 访问 → 只信任 127.0.0.1（默认，安全）
    #   方案 B（端口映射 + Cloudflare 代理）：对端是 Cloudflare 边缘 → 改为信任其官方网段。
    #     用 curl -s https://www.cloudflare.com/ips-v4 生成，不要手抄（会过期）；
    #     更稳妥是在防火墙只放行 Cloudflare 网段后，再信任全部来源。
    # 切勿写 0.0.0.0/0：那等于允许任何能直连 80 端口的人伪造来源 IP，从而绕过 IP 限流。
    set_real_ip_from 127.0.0.1;
    real_ip_header    CF-Connecting-IP;

    server {
        listen 80;
        server_name _;

        # 安全响应头。CSP 必须保留 style-src 'unsafe-inline'：Vue 的 :style 会生成内联样式属性；
        # 前端产物已确认无内联脚本，故 script-src 可收紧到 'self'。
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

        # 前端构建产物（先执行 cd frontend-chat && npm run build）
        # root 为本机绝对路径，请改成你的项目实际位置，例如 D:/code/DeepAgent-RAG/frontend-chat/dist
        root  C:/path/to/DeepAgent-RAG/frontend-chat/dist;
        index index.html;

        # ---------- 后端 API（含 SSE 流式对话） ----------
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # SSE 必需三件套：不缓冲、不压缩、长超时。
            # 缺失任一都会表现为「长时间没反应，然后整段答案一次性蹦出来」，或首字节慢时 504
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------- 前端静态资源 ----------
        location /assets/ {
            expires 30d;
            # 注意：此 location 一旦出现 add_header，server 级的安全响应头就不再继承，
            # 因此这里只用 expires（它自带 Cache-Control: max-age）。
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
